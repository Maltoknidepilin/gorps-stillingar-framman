description:
  eng: |
    <p>
      The <strong>Faroese Megaword Corpus (Miklamálgrunnurin)</strong> search interface allows users to search a large, diverse and linguistically annotated corpus of Faroese texts.
      The Faroese Megaword Corpus contains various types of texts from a wide range of sources and time periods.
      Further information about the corpus is available by selecting <strong>MENU</strong> → <strong>About Miklamálgrunnurin</strong>.
      Users can search for words, lemmas and grammatical features, such as gender and case, as well as metadata such as year of publication, text type and author.
      Further information is available in the user guide.
    </p>
  fao: |
    <p>
      Á leitisíðuni hjá <strong>Miklamálgrunninum</strong> ber til at leita í einum stórum, fjølbroyttum og málsliga markaðum føroyskum tekstasavni.
      Miklamálgrunnurin fevnir um ymisk tekstasløg úr nógvum ymiskum keldum og tíðarskeiðum. Nærri upplýsingar um tekstagrunnin fáast við at trýsta á <strong>VALMYND</strong> → <strong>Um Miklamálgrunnin</strong>.
      Tað ber til at leita eftir orðum, leitorðum og málfrøðiligum eginleikum, eitt nú kyni og falli, umframt tekstupplýsingum sum útgávuári, tekstaslagi og høvundi.
      Fleiri upplýsingar eru at finna í leiðbeiningini.
    </p>

auth_module:
  module: "basic_auth"
  options:
    default_value_remember: true

# autocomplete: true
map_enabled: false
# Padding is applied by the player; stored forced-alignment times stay exact.
audio_playback:
  pre_roll: 0.25
  post_roll: 0.40
hits_per_page_values:
  - 25
  - 50
  - 75
  - 100
  - 500
  - 1000

enable_backend_kwic_download: false
enable_frontend_kwic_download: true

default_language: fao
languages:
  - value: eng
    label: English
  - value: fao
    label: Føroyskt

#    <img ng-if="$root.lang == 'fao'" src="img/MMG.png" height="300" width="300" />
#    <img ng-if="$root.lang != 'swe'" src="img/korp_slogan_en.svg" height="300" width="300" />
logo:
  korp: |
    <img ng-if="$root.lang == 'fao'" src="img/Miklamálgrunnurin.svg" height="65" style="height:65px; width:auto;" />
    <img ng-if="$root.lang != 'fao'" src="img/Miklamálgrunnurin.svg" height="65" style="height:65px; width:auto;" />
  organization: |
    <a
        class="hidden min-[1150px]:flex h-20 shrink flex-col justify-end"
        href="https://mtd.setur.fo/"
        target="_blank"
    >
        <img ng-if="$root.lang == 'fao'" src="img/Maltoknidepilin.svg" height="65" style="height:65px; width:auto;" />
        <img ng-if="$root.lang != 'fao'" src="img/Maltoknidepilin_en.svg" height="65" style="height:65px; width:auto;" />
    </a>

    <a class="hidden xl:block shrink-0" href="https://setur.fo/" target="_blank">
        <img src="img/setur.svg" class="h-full" height="65" width="65"/>
    </a>

frontpage:
  corpus_updates: false

group_statistics:
  - saldo
  - prefix
  - suffix
  - lex
  - lemma
  - sense
  - text_swefn
  - text_blingbring
  - word-prediction--kb-bert
  - e_cat

statistics_search_default: false
has_timespan: true

# for 'compile statistics by' selector, can be 'union' or 'intersection'
reduce_word_attribute_selector: intersection
reduce_struct_attribute_selector: intersection

word_label:
  fao: orð
  eng: word

matomo:
  url: https://spraakbanken.gu.se/stats/
  # Enable real reporting only on live sites
  staging:
    site: 3
  production:
    site: 3

# news_url: https://raw.githubusercontent.com/spraakbanken/newsdesk/main/data/korp.yaml    

word_picture: false

word_picture_tagset:
    # supported pos-tags
    verb: vb
    noun: nn
    adjective: jj
    adverb: ab
    preposition: pp

    # dependency releations
    subject: ss
    object: obj
    adverbial: adv
    preposition_rel: pa
    pre_modifier: at
    post_modifier: et
    adverbial2: aa

word_picture_conf:
  verb:
    - - rel: subject
        css_class: color_blue
      - _
      - rel: object
        css_class: color_purple
      - rel: adverbial
        css_class: color_green
  noun:
    - - rel: preposition_rel
        css_class: color_yellow
        field_reverse: true
      - rel: pre_modifier
        css_class: color_azure
      - _
      - rel: post_modifier
        css_class: color_red
    - - _
      - rel: subject
        css_class: color_blue
        field_reverse: true
        alt_label: vb
    - - rel: object
        css_class: color_purple
        field_reverse: true
        alt_label: vb
      - _
  adjective:
    - - _
      - rel: pre_modifier
        css_class: color_yellow
        field_reverse: true
    - - rel: adverbial2
        css_class: color_purple
      - _
  adverb:
    - - _
      - rel: adverbial
        css_class: color_yellow
        field_reverse: true
    - - _
      - rel: adverbial2
        css_class: color_purple
        field_reverse: true
  preposition:
    - - _
      - rel: preposition_rel
        css_class: color_green

default_overview_context: 1 sentence
default_reading_context: 1 paragraph

default_within:
  sentence: sentence

default_options:
  is: =
  is_not: '!='
  starts_with: ^=
  contains: _=
  ends_with: '&='
  matches: '*='
  matches_not: '!*='

# Fallback only; overridden by KORP_BACKEND_URL (see gorpur-framman/app/scripts/data_init.ts)
korp_backend_url: 'http://localhost:1236'

map_center:
  lat: 62.99515845212052
  lng: 16.69921875
  zoom: 4

common_struct_types:
  date_interval:
    label:
      fao: Tíðarskeið
      eng: Time interval
      swe: tidsintervall
    hide_sidebar: 'true'
    hide_compare: 'true'
    hide_statistics: 'true'
    opts: false
    extended_component: dateInterval
